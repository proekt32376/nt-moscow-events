<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NT.Moscow — мероприятия</title>
<style>
  :root {
    --bg: #f3f6fb;
    --surface: #ffffff;
    --ink: #1b2433;
    --muted: #5d6b82;
    --line: #d5dce8;
    --accent: #1f5eff;
    --accent-ink: #ffffff;
    --error: #c62828;
    --ok-bg: #e4f6ea;
    --ok-ink: #17632f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151d;
      --surface: #1a2030;
      --ink: #e8edf7;
      --muted: #9aa8c0;
      --line: #2c364b;
      --accent: #6b93ff;
      --accent-ink: #0d1424;
      --error: #ff8a80;
      --ok-bg: #16301f;
      --ok-ink: #8ee0a6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header, main { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  header { padding-top: 32px; padding-bottom: 8px; }
  h1 { margin: 0; font-size: 1.9rem; }
  header p { margin: 4px 0 0; color: var(--muted); }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }

  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; padding-bottom: 40px; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }

  .event-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .event-btn {
    width: 100%; text-align: left; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; cursor: pointer;
  }
  .event-btn:hover { border-color: var(--accent); }
  .event-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
  .event-btn:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .event-title { font-weight: 600; display: block; }
  .event-meta { color: var(--muted); font-size: .9rem; }

  .detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; }
  .detail h3 { margin: 0 0 12px; font-size: 1.25rem; }
  .placeholder { color: var(--muted); }

  form { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input {
    width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input[aria-invalid="true"] { border-color: var(--error); }
  .field { margin-bottom: 14px; }
  .error { color: var(--error); font-size: .9rem; min-height: 1.3em; margin: 4px 0 0; }
  .submit {
    font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 8px;
    padding: 10px 18px; background: var(--accent); color: var(--accent-ink);
  }
  .success {
    margin-top: 14px; padding: 12px 14px; border-radius: 8px;
    background: var(--ok-bg); color: var(--ok-ink); font-weight: 600;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>NT.Moscow</h1>
  <p>Мероприятия колледжа</p>
</header>

<main class="layout">
  <section class="panel" aria-labelledby="list-title">
    <h2 id="list-title">Список мероприятий</h2>
    <ul class="event-list" id="eventList"></ul>
  </section>

  <section class="panel detail" aria-labelledby="detail-title" aria-live="polite">
    <h2 id="detail-title">Выбранное мероприятие</h2>
    <p class="placeholder" id="placeholder">Выберите мероприятие в списке слева.</p>

    <div id="detail" hidden>
      <h3 id="dTitle"></h3>
      <dl>
        <dt>Дата</dt><dd id="dDate"></dd>
        <dt>Место</dt><dd id="dPlace"></dd>
        <dt>Описание</dt><dd id="dDesc"></dd>
      </dl>

      <form id="form" novalidate>
        <h2>Заявка на участие</h2>
        <div class="field">
          <label for="name">Имя</label>
          <input id="name" name="name" type="text" autocomplete="name">
          <p class="error" id="nameError"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email">
          <p class="error" id="emailError"></p>
        </div>
        <button class="submit" type="submit">Отправить</button>
        <div class="success" id="success" role="status" hidden>Заявка отправлена</div>
      </form>
    </div>
  </section>
</main>

<script>
  // Данные мероприятий записаны прямо в коде (технический долг TD-01)
  const events = [
    { id: 1, title: "День открытых дверей", date: "20 октября, 12:00", place: "аудитория 101", description: "Знакомство с факультетами и студенческими организациями." },
    { id: 2, title: "Лекция по искусственному интеллекту", date: "22 октября, 15:30", place: "аудитория 305", description: "Открытая лекция о том, как работают современные нейросети." },
    { id: 3, title: "Настольный тенис с командой NT.Moscow", date: "25 октября, 10:00", place: "4 этаж", description: "Командное обучение в настольный тенис." },
    { id: 4, title: "турнир по War Thunder", date: "28 октября, 13:00", place: "актовый зал", description: "Командный турнир по War Thunder: сражения на технике разных эпох и борьба за звание лучшей команды." },
    { id: 5, title: "практика по Pyton", date: "30 октября, 17:00", place: "Актовый зал", description: "Практическое занятие по Python: пишем код на реальных задачах и разбираем основы с преподавателем.." }
  ];

  const listEl = document.getElementById("eventList");
  const detailEl = document.getElementById("detail");
  const placeholderEl = document.getElementById("placeholder");
  const form = document.getElementById("form");
  const successEl = document.getElementById("success");

  // 1. Список мероприятий
  events.forEach(ev => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "event-btn";
    btn.setAttribute("aria-pressed", "false");
    btn.dataset.id = ev.id;
    btn.innerHTML = '<span class="event-title"></span><span class="event-meta"></span>';
    btn.querySelector(".event-title").textContent = ev.title;
    btn.querySelector(".event-meta").textContent = ev.date + " — " + ev.place;
    btn.addEventListener("click", () => selectEvent(ev.id));
    li.appendChild(btn);
    listEl.appendChild(li);
  });

  // 2. Карточка выбранного мероприятия
  function selectEvent(id) {
    const ev = events.find(e => e.id === id);
    document.querySelectorAll(".event-btn").forEach(b =>
      b.setAttribute("aria-pressed", String(Number(b.dataset.id) === id)));
    document.getElementById("dTitle").textContent = ev.title;
    document.getElementById("dDate").textContent = ev.date;
    document.getElementById("dPlace").textContent = ev.place;
    document.getElementById("dDesc").textContent = ev.description;
    placeholderEl.hidden = true;
    detailEl.hidden = false;
    resetForm();
  }

  function resetForm() {
    form.reset();
    successEl.hidden = true;
    ["name", "email"].forEach(f => setError(f, ""));
  }

  function setError(field, message) {
    document.getElementById(field + "Error").textContent = message;
    document.getElementById(field).setAttribute("aria-invalid", message ? "true" : "false");
  }

  // 3. Форма: проверка обязательных полей
  form.addEventListener("submit", e => {
    e.preventDefault();
    successEl.hidden = true;

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    let ok = true;

    if (!name) { setError("name", "Введите имя"); ok = false; } else { setError("name", ""); }

    if (!email) {
      setError("email", "Введите email"); ok = false;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setError("email", "Проверьте формат email, например name@mail.com"); ok = false;
    } else { setError("email", ""); }

    if (!ok) return;

    // Демонстрация: данные на сервер НЕ отправляются и нигде не сохраняются
    form.reset();
    successEl.hidden = false;
  });
</script>
</body>
</html>
